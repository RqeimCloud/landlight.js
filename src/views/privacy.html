<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <include src="src/components/theme.html"></include>
  <title>{{t:privacy.title}}</title>
  <meta name="description" content="{{t:privacy.description}}" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="antialiased">
  <include src="src/components/header.html"></include>

  <main id="main" class="mx-auto max-w-3xl px-5 py-20 md:py-28">
    <p class="eyebrow mono">{{t:privacy.eyebrow}}</p>
    <h1 class="font-display mt-6 text-[clamp(2rem,4.4vw,3rem)] leading-[1.3] text-ink">{{t:privacy.heading}}</h1>
    <p class="mt-6 text-sm text-muted">{{t:privacy.updated}}</p>

    <div class="mt-10 flex flex-col gap-8">
      <section class="flex flex-col gap-3">
        <h2 class="font-display text-xl text-ink">{{t:privacy.section}}</h2>
        <p class="text-[15px] leading-[1.9] text-ink-soft">{{t:privacy.text}}</p>
      </section>
      <section class="flex flex-col gap-3">
        <h2 class="font-display text-xl text-ink">{{t:privacy.useHeading}}</h2>
        <p class="text-[15px] leading-[1.9] text-ink-soft">{{t:privacy.useText}}</p>
      </section>
      <section class="flex flex-col gap-3">
        <h2 class="font-display text-xl text-ink">{{t:privacy.contactHeading}}</h2>
        <p class="text-[15px] leading-[1.9] text-ink-soft">
          <a href="mailto:{{email}}" class="underline underline-offset-4 transition-colors hover:text-gold-ink" dir="ltr">{{email}}</a>
        </p>
      </section>
    </div>
  </main>

  <include src="src/components/footer.html"></include>

  <script type="module" src="/app.js"></script>
</body>
</html>
