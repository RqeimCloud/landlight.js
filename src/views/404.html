<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{t:notFound.title}}</title>
  <meta name="description" content="{{t:notFound.text}}" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <include src="src/components/header.html"></include>

  <main id="main" class="max-w-2xl mx-auto px-4 py-24 text-center">
    <h1 class="text-3xl font-bold mb-4">{{t:notFound.heading}}</h1>
    <p class="text-lg text-gray-700 mb-2">{{t:notFound.text}}</p>
    <p lang="en" dir="ltr" class="text-lg text-gray-700 mb-8">This page does not exist.</p>
    <a href="{{href:index}}" class="inline-block px-6 py-3 bg-brand text-white font-medium rounded-lg hover:bg-brand-dark transition-colors">{{t:notFound.home}}</a>
  </main>

  <include src="src/components/footer.html"></include>

  <script type="module" src="/app.js"></script>
</body>
</html>
