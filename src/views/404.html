<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <include src="src/components/theme.html"></include>
  <title>{{t:notFound.title}}</title>
  <meta name="description" content="{{t:notFound.text}}" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="antialiased">
  <include src="src/components/header.html"></include>

  <main id="main" class="relative">
  <include src="src/components/backdrop.html"></include>

  <div class="page-shell is-centered">
    <p class="eyebrow is-centered mono">{{t:notFound.eyebrow}}</p>
    <h1 class="page-title">{{t:notFound.heading}}</h1>
    <p class="page-lead">{{t:notFound.text}}</p>
    <p lang="en" dir="ltr" class="mt-2 text-base leading-[1.9] text-muted">This page does not exist.</p>
    <a href="{{href:index}}" class="btn-gold mt-10">{{t:notFound.home}}</a>
  </div>
</main>

  <include src="src/components/footer.html"></include>

  <script type="module" src="/app.js"></script>
</body>
</html>
