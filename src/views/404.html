<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{t:notFound.title}}</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <include src="src/components/header.html"></include>

  <main id="main" class="shell py-24">
    <p class="eyebrow">404</p>
    <h1 class="mt-4 text-3xl font-semibold">{{t:notFound.heading}}</h1>

    <a href="{{href:index}}" class="btn mt-8">{{t:notFound.cta}}</a>
  </main>

  <include src="src/components/footer.html"></include>
  <script type="module" src="/app.js"></script>

</html>
