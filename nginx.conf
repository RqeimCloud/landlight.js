server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    if ($request_uri ~ ^/(.*/)?index\.html$) {
        return 301 /$1;
    }

    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1;
    }

    # Revalidated every time: a deploy, sw.js included, reaches visitors at once.
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    # Vite names these by content hash, so the edge and browsers keep them and the machine
    # is not asked again. `expires` only, so the headers above still apply here.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    access_log off;
    error_log /var/log/nginx/error.log error;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /404.html;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
