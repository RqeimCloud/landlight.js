server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Vite names these by content hash, so the edge and browsers keep them and the machine
    # is not asked again. `expires` only, so the headers above still apply here.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    access_log off;
    error_log /var/log/nginx/error.log error;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /404.html;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
