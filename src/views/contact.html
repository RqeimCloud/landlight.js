<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{t:contact.title}}</title>
  <meta name="description" content="{{t:contact.description}}" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <include src="src/components/header.html"></include>

  <main id="main" class="shell py-16">
    <h1 class="text-3xl font-semibold">{{t:contact.heading}}</h1>
    <p class="mt-4 max-w-2xl leading-8 text-ink-soft">{{t:contact.lead}}</p>
    <div class="mt-8 grid max-w-xl gap-3 text-sm">
      <p><span class="font-semibold">{{t:contact.emailLabel}}:</span> <a href="mailto:{{t:contact.email}}" class="link">{{t:contact.email}}</a></p>
      <p><span class="font-semibold">{{t:contact.phoneLabel}}:</span> <a href="tel:{{t:contact.phone}}" class="link" dir="ltr">{{t:contact.phone}}</a></p>
    </div>
  </main>

  <include src="src/components/footer.html"></include>
  <script type="module" src="/app.js"></script>
</body>
</html>
