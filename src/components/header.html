<a href="#main" class="skip-link">{{t:ui.skip}}</a>
<header class="site-header">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-4">
    <a href="{{href:index}}" class="flex items-center gap-3">
      <span class="relative grid h-10 w-10 place-items-center rounded-xl bg-paper-deep shadow-[inset_0_0_0_1px_var(--gold),0_8px_24px_-12px_var(--gold-deep)]">
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="bolt-header" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--gold-light)" />
              <stop offset="1" stop-color="var(--gold-deep)" />
            </linearGradient>
          </defs>
          <path d="M13 2 4.5 13.2h6L10.2 22 19.5 10.4h-6.1L13 2Z" fill="url(#bolt-header)" />
        </svg>
      </span>
      <span class="flex flex-col leading-none">
        <span class="font-display text-[19px] text-ink">{{t:brand.name}}</span>
        <span class="mono mt-1.5 text-[8.5px] uppercase tracking-[0.3em] text-gold-ink/80">{{t:brand.mono}}</span>
      </span>
    </a>

    <nav class="hidden items-center gap-9 md:flex" aria-label="{{t:ui.mainNav}}">
      <a href="{{href:index}}#features" class="nav-link">{{t:nav.features}}</a>
      <a href="{{href:index}}#how" class="nav-link">{{t:nav.how}}</a>
      <a href="{{href:contact}}" class="nav-link">{{t:nav.contact}}</a>
    </nav>

    <div class="hidden items-center gap-2 md:flex">
      <a href="{{locale:{{t:language.other}}}}" hreflang="{{t:language.other}}" lang="{{t:language.other}}"
         class="mono rounded-full px-3 py-2 text-[10.5px] uppercase tracking-[0.2em] text-ink-soft transition-colors hover:text-gold-ink"
         aria-label="{{t:language.otherName}} — {{t:ui.switchLanguage}}">{{t:language.otherName}}</a>
      <button type="button" data-theme-toggle aria-label="{{t:ui.theme}}"
              class="grid h-10 w-10 place-items-center rounded-full text-ink-soft transition-colors hover:bg-accent-soft hover:text-gold-ink">
        <svg class="icon-sun h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path stroke-linecap="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
        <svg class="icon-moon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
      </button>
      <a href="{{href:contact}}" class="btn-gold !px-5 !py-2.5 !text-[13px]">{{t:nav.start}}</a>
    </div>

    <div class="flex items-center gap-2 md:hidden">
      <a href="{{locale:{{t:language.other}}}}" hreflang="{{t:language.other}}" lang="{{t:language.other}}"
         class="mono grid h-10 place-items-center rounded-xl border border-line px-3 text-[10.5px] uppercase tracking-[0.2em] text-ink-soft"
         aria-label="{{t:language.otherName}} — {{t:ui.switchLanguage}}">{{t:language.otherName}}</a>
      <button type="button" data-theme-toggle aria-label="{{t:ui.theme}}"
              class="grid h-10 w-10 place-items-center rounded-xl border border-line text-ink-soft">
        <svg class="icon-sun h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path stroke-linecap="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
        <svg class="icon-moon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
      </button>
      <button type="button" popovertarget="site-menu" aria-label="{{t:ui.menu}}"
              class="grid h-10 w-10 place-items-center rounded-xl border border-line text-ink transition-colors hover:border-gold">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-width="1.6" d="M4 8h16M8 16h12" /></svg>
      </button>
    </div>
  </div>

  <nav id="site-menu" popover class="site-menu md:hidden" aria-label="{{t:ui.mobileNav}}">
    <div class="mx-auto flex max-w-6xl flex-col px-5 pt-2 pb-6">
      <a href="{{href:index}}#features" class="flex items-center justify-between border-b border-line py-3.5 text-[15px] text-ink-soft transition-colors hover:text-ink">{{t:nav.features}}<span class="font-numeral text-sm text-gold-ink/70">I</span></a>
      <a href="{{href:index}}#how" class="flex items-center justify-between border-b border-line py-3.5 text-[15px] text-ink-soft transition-colors hover:text-ink">{{t:nav.how}}<span class="font-numeral text-sm text-gold-ink/70">II</span></a>
      <a href="{{href:contact}}" class="flex items-center justify-between border-b border-line py-3.5 text-[15px] text-ink-soft transition-colors hover:text-ink">{{t:nav.contact}}<span class="font-numeral text-sm text-gold-ink/70">III</span></a>
      <a href="{{href:contact}}" class="btn-gold mt-6">{{t:nav.start}}</a>
    </div>
  </nav>
</header>
