<a href="#main" class="skip-link">{{t:ui.skip}}</a>
<header class="border-b border-line">
  <div class="shell flex flex-wrap items-center justify-between gap-x-6 gap-y-3 py-4">
    <a href="{{href:index}}" class="text-lg font-semibold text-ink no-underline">{{t:brand.name}}</a>
    <nav class="flex flex-wrap items-center gap-5 text-sm" aria-label="{{t:ui.mainNav}}">
      <a href="{{href:index}}" class="link">{{t:nav.home}}</a>
      <a href="{{href:contact}}" class="link">{{t:nav.contact}}</a>
      <a href="{{locale:{{t:language.other}}}}" hreflang="{{t:language.other}}" lang="{{t:language.other}}"
         class="link" aria-label="{{t:language.otherName}} — {{t:ui.switchLanguage}}">{{t:language.otherName}}</a>
    </nav>
  </div>
</header>
