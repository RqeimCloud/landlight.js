<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <include src="src/components/theme.html"></include>
  <title>{{t:contact.title}}</title>
  <meta name="description" content="{{t:contact.description}}" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="antialiased">
  <include src="src/components/header.html"></include>

  <main id="main" class="relative">
  <include src="src/components/backdrop.html"></include>

  <div class="page-shell">
    <p class="eyebrow mono">{{t:contact.eyebrow}}</p>
    <h1 class="page-title">{{t:contact.heading}}</h1>
    <p class="page-lead">{{t:contact.lead}}</p>

    <div class="mt-12 grid gap-4 sm:grid-cols-2">
      <a href="mailto:{{email}}" class="card-lux is-hover group flex items-center gap-4 p-6">
        <span class="icon-ring shrink-0">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.5 7.5 12 13l8.5-5.5M4.5 5.5h15a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1Z" /></svg>
        </span>
        <span class="min-w-0">
          <span class="block text-sm text-ink">{{t:contact.emailLabel}}</span>
          <span class="mt-1 block truncate text-sm text-ink-soft" dir="ltr">{{email}}</span>
        </span>
      </a>
      <a href="tel:{{tel}}" class="card-lux is-hover group flex items-center gap-4 p-6">
        <span class="icon-ring shrink-0">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.6 3.5h2.2l1.6 4-2 1.4a11 11 0 0 0 5.5 5.5l1.4-2 4 1.6v2.2a2.3 2.3 0 0 1-2.5 2.3C9.9 17.8 6.2 14.1 4.3 6A2.3 2.3 0 0 1 6.6 3.5Z" /></svg>
        </span>
        <span class="min-w-0">
          <span class="block text-sm text-ink">{{t:contact.phoneLabel}}</span>
          <span class="mt-1 block text-sm text-ink-soft" dir="ltr">{{phone}}</span>
        </span>
      </a>
    </div>

    <div class="ornament mt-14" aria-hidden="true">
      <svg class="h-2.5 w-2.5" viewBox="0 0 10 10"><path d="M5 0 10 5 5 10 0 5Z" fill="currentColor" /></svg>
    </div>

    <p class="mt-6 text-sm leading-[1.9] text-muted">{{t:contact.note}}</p>
    <p class="mt-6">
      <a href="{{href:index}}" class="text-sm text-ink-soft underline underline-offset-4 transition-colors hover:text-gold-ink">{{t:contact.back}}</a>
    </p>
  </div>
</main>

  <include src="src/components/footer.html"></include>

  <script type="module" src="/app.js"></script>
</body>
</html>
