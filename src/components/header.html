<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-2 focus:bg-white focus:p-3">{{t:ui.skip}}</a>
<header class="bg-white border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="{{href:index}}" class="flex items-center gap-3">
      <img src="/logo.svg" alt="" width="32" height="32" class="h-8 w-8" />
      <span class="font-semibold text-lg text-gray-900">Landlight</span>
    </a>
    <button type="button" popovertarget="site-menu" aria-label="{{t:ui.openMenu}}" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
      <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <nav class="hidden md:flex items-center gap-6" aria-label="{{t:ui.mainNav}}">
        <a href="{{href:index}}" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:nav.home}}</a>
        <a href="{{href:index}}#faq" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:nav.faq}}</a>
        <a href="{{href:contact}}" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:nav.contact}}</a>
        <a href="{{locale:{{t:language.other}}}}" hreflang="{{t:language.other}}" lang="{{t:language.other}}" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:language.otherName}}</a>
    </nav>
  </div>
  <nav id="site-menu" popover class="md:hidden m-0 mt-14 w-full border-b border-gray-200 bg-white p-4" aria-label="{{t:ui.mobileNav}}">
    <div class="flex flex-col">
        <a href="{{href:index}}" class="py-3 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:nav.home}}</a>
        <a href="{{href:index}}#faq" class="py-3 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:nav.faq}}</a>
        <a href="{{href:contact}}" class="py-3 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:nav.contact}}</a>
        <a href="{{locale:{{t:language.other}}}}" hreflang="{{t:language.other}}" lang="{{t:language.other}}" class="py-3 text-sm text-gray-700 hover:text-gray-900 transition-colors">{{t:language.otherName}}</a>
    </div>
  </nav>
</header>
